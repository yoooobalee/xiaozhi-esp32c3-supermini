name: Build ESP32-C3 SuperMini Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
    - name: Checkout board config
      uses: actions/checkout@v4
      with:
        path: board-config

    - name: Checkout xiaozhi-esp32
      uses: actions/checkout@v4
      with:
        repository: 78/xiaozhi-esp32
        path: xiaozhi-esp32
        submodules: recursive
        fetch-depth: 1
      timeout-minutes: 30

    - name: Setup board config (manual)
      run: |
        mkdir -p xiaozhi-esp32/main/boards/esp32c3-supermini
        cp board-config/config.h xiaozhi-esp32/main/boards/esp32c3-supermini/
        cp board-config/esp32c3_supermini_board.cc xiaozhi-esp32/main/boards/esp32c3-supermini/

    - name: Set target & configure sdkconfig
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        cd xiaozhi-esp32
        echo "Setting target to esp32c3..."
        idf.py set-target esp32c3
        echo ""
        echo "Appending SDK config..."
        cat >> sdkconfig << 'SDKCONFIG_EOF'
CONFIG_IDF_TARGET="esp32c3"
CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"
CONFIG_PM_ENABLE=y
CONFIG_FREERTOS_USE_TICKLESS_IDLE=y
CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
CONFIG_ESP_MAIN_TASK_STACK_SIZE=7168
CONFIG_FREERTOS_HZ=1000
CONFIG_FREERTOS_IDLE_TASK_STACKSIZE=768
CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM=3
CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=4
CONFIG_ESP_WIFI_AMPDU_TX_ENABLED=n
CONFIG_ESP_WIFI_RX_BA_WIN=4
CONFIG_ESP_WIFI_ENABLE_WPA3_SAE=n
CONFIG_ESP_WIFI_ESPNOW_MAX_ENCRYPT_NUM=0
CONFIG_ESP_WIFI_ENTERPRISE_SUPPORT=n
CONFIG_LWIP_MAX_SOCKETS=10
CONFIG_LWIP_TCPIP_RECVMBOX_SIZE=16
CONFIG_LWIP_IPV6=n
CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=2048
CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA=y
CONFIG_NEWLIB_NANO_FORMAT=y
CONFIG_COMPILER_OPTIMIZATION_SIZE=y
CONFIG_USE_ESP_WAKE_WORD=y
CONFIG_SR_WN_WN9S_NIHAOXIAOZHI=y
SDKCONFIG_EOF
        echo "Config done."

    - name: Build firmware (direct idf.py)
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        cd xiaozhi-esp32
        idf.py -DBOARD_NAME=esp32c3-supermini -DBOARD_TYPE=esp32c3-supermini build

    - name: Merge binary
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        cd xiaozhi-esp32
        idf.py merge-bin || echo "merge-bin skipped"

    - name: List all output files
      shell: bash
      run: |
        echo "=== All .bin files ==="
        find xiaozhi-esp32/build -name "*.bin" 2>/dev/null | head -30
        echo "=== All .elf files ==="
        find xiaozhi-esp32/build -name "*.elf" 2>/dev/null | head -10
        echo "=== build directory top level ==="
        ls -la xiaozhi-esp32/build/ 2>/dev/null | head -15

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp32c3-supermini-firmware
        path: |
          xiaozhi-esp32/build/**/*.bin
          xiaozhi-esp32/build/**/*.elf
