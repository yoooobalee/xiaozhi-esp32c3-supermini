name: Build ESP32-C3 SuperMini Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4

    steps:
    - name: Checkout board config
      uses: actions/checkout@v4
      with:
        path: board-config

    - name: Checkout xiaozhi-esp32
      uses: actions/checkout@v4
      with:
        repository: 78/xiaozhi-esp32
        path: xiaozhi-esp32
        submodules: recursive
        fetch-depth: 1
      timeout-minutes: 30

    - name: Setup board config
      run: |
        mkdir -p xiaozhi-esp32/main/boards/esp32c3-supermini
        cp board-config/config.h xiaozhi-esp32/main/boards/esp32c3-supermini/ || true
        cp board-config/esp32c3_supermini_board.cc xiaozhi-esp32/main/boards/esp32c3-supermini/ || true
        cd xiaozhi-esp32
        python3 ../board-config/scripts/setup_board.py main || true

    - name: Build firmware with release.py
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        cd xiaozhi-esp32
        python3 scripts/release.py esp32c3-supermini --name esp32c3-supermini || true

    - name: Find built firmware files
      shell: bash
      run: |
        echo "=== Searching for firmware output ==="
        find xiaozhi-esp32/build/ -name "*.bin" -o -name "*.elf" 2>/dev/null | head -30
        echo "=== Checking common paths ==="
        ls -la xiaozhi-esp32/build/*.bin 2>/dev/null || echo "No .bin in build root"
        ls -la xiaozhi-esp32/build/partition_table/ 2>/dev/null || echo "No partition_table"
        ls -la xiaozhi-esp32/build/bootloader/ 2>/dev/null | head -5 || echo "No bootloader"
        echo "=== Check merged binary ==="
        ls -la xiaozhi-esp32/build/merged-binary.bin 2>/dev/null || echo "merged-binary.bin NOT found"
        ls -la xiaozhi-esp32/build/xiaozhi*/ 2>/dev/null || echo "No xiaozhi subdirectory"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32c3-supermini-firmware
        path: |
          xiaozhi-esp32/build/**/*.bin
          xiaozhi-esp32/build/**/*.elf
        if-no-files-found: warn
