name: Build ESP32-C3 SuperMini Firmware

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    timeout-minutes: 30

    steps:
    - name: Checkout board config
      uses: actions/checkout@v4
      with:
        path: board-config

    - name: Checkout xiaozhi-esp32
      uses: actions/checkout@v4
      with:
        repository: 78/xiaozhi-esp32
        path: xiaozhi-esp32
        submodules: recursive
        fetch-depth: 1
      timeout-minutes: 30

    - name: Copy board files + run setup_board.py
      shell: bash
      run: |
        mkdir -p xiaozhi-esp32/main/boards/esp32c3-supermini
        cp board-config/config.h xiaozhi-esp32/main/boards/esp32c3-supermini/
        cp board-config/esp32c3_supermini_board.cc xiaozhi-esp32/main/boards/esp32c3-supermini/
        echo "--- Running setup_board.py ---"
        cd xiaozhi-esp32
        python3 ../board-config/scripts/setup_board.py main
        echo "--- Board registration done ---"

    - name: Build with release.py
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        cd xiaozhi-esp32
        echo "=== Starting release.py build ==="
        python3 scripts/release.py esp32c3-supermini --name esp32c3-supermini
        echo "=== Build completed ==="
        echo "=== Checking releases directory ==="
        ls -la releases/ 2>/dev/null || echo "No releases directory"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32c3-supermini-firmware
        path: xiaozhi-esp32/releases/
        if-no-files-found: warn
