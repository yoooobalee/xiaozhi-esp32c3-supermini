name: Build ESP32-C3 SuperMini Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2

    steps:
    - name: Checkout board config
      uses: actions/checkout@v4
      with:
        path: board-config

    - name: Checkout xiaozhi-esp32
      uses: actions/checkout@v4
      with:
        repository: 78/xiaozhi-esp32
        path: xiaozhi-esp32
        submodules: recursive
        fetch-depth: 1
      timeout-minutes: 30

    - name: Setup board
      run: |
        mkdir -p xiaozhi-esp32/main/boards/esp32c3-supermini
        cp board-config/config.h xiaozhi-esp32/main/boards/esp32c3-supermini/ || true
        cp board-config/config.json xiaozhi-esp32/main/boards/esp32c3-supermini/ 2>/dev/null || true
        cp board-config/esp32c3_supermini_board.cc xiaozhi-esp32/main/boards/esp32c3-supermini/ || true
        cd xiaozhi-esp32 && python3 ../board-config/scripts/setup_board.py main || true

    - name: Build firmware
      shell: bash
      run: |
        source $IDF_PATH/export.sh
        cd xiaozhi-esp32
        idf.py set-target esp32c3
        echo "CONFIG_BOARD_TYPE_ESP32C3_SUPERMINI=y" >> sdkconfig
        idf.py reconfigure
        idf.py build
        esptool.py --chip esp32c3 merge_bin -o build/merged-binary.bin \
          --flash_mode dio --flash_size 4MB \
          0x0 build/bootloader/bootloader.bin \
          0x8000 build/partition_table/partition-table.bin \
          0x10000 build/xiaozhi.bin

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: esp32c3-supermini-firmware
        path: xiaozhi-esp32/build/merged-binary.bin
        if-no-files-found: error
